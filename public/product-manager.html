<title>Imprint Studio · Product Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#eef2f8;--surface:#fff;--panel:#f6f9fd;--ink:#0f2748;--ink-soft:#3f5570;--muted:#7688a0;--border:#dce4ef;--border-strong:#c3d0e2;--accent:#2f6fed;--accent-ink:#fff;--ok:#1a9b73;--warn:#c67d10;--radius:9px;--ui:"Inter",system-ui,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1320;--surface:#111d2e;--panel:#0e1927;--ink:#e8eef8;--ink-soft:#b2c2d8;--muted:#7e92ac;--border:#213349;--border-strong:#2d445f;--accent:#4d8bf0;--accent-ink:#0a1320;--ok:#3cce9f;--warn:#e0a53f;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0a1320;--surface:#111d2e;--panel:#0e1927;--ink:#e8eef8;--ink-soft:#b2c2d8;--muted:#7e92ac;--border:#213349;--border-strong:#2d445f;--accent:#4d8bf0;--accent-ink:#0a1320;--ok:#3cce9f;--warn:#e0a53f;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700}
.brand b{font-size:16px}.brand span{font-size:12px;color:var(--muted);display:block}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
input#q{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:5px 11px;border-radius:100px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;color:var(--ink-soft)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:.12s}
.card:hover{border-color:var(--accent)}
.thumb{height:84px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:9px}
.card h4{margin:0 0 3px;font-size:13px;font-weight:600;line-height:1.3;height:34px;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.sku{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px}
.cardact{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
.cardact .ko-prev{font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:none}
.cardact .ko-prev:hover{text-decoration:underline}
.cardact .ko-edit{font-size:11px;color:var(--muted)}
.b-ready{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.b-pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.stat.click{cursor:pointer;transition:.12s}
.stat.click:hover{border-color:var(--border-strong)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.stat.on.ok-on{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.stat.on.warn-on{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
.card{position:relative}
.card.ko-ready{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.card.ko-ready:before,.card.ko-pending:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0}
.card.ko-ready:before{background:var(--ok)}
.card.ko-pending:before{background:var(--warn)}
.price{font-weight:700;color:var(--ink)}
.stock{font-size:11px}
.more{text-align:center;margin:16px 0}
button{font:inherit;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
dialog{border:none;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(8,18,34,.34)}
dialog::backdrop{background:rgba(8,18,34,.5)}
.modal{padding:18px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 2px;font-size:17px}.modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg .chip{flex:0}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.mlist label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:4px 0}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.up{display:block;text-align:center;border:1px dashed var(--border-strong);border-radius:8px;padding:14px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.setupstat{font-size:12px;padding:3px 9px;border-radius:100px;display:inline-block}
</style>

<script>
const CAT_COLORS={"Eco Friendly":"#1d9e75","Drinkware":"#2f6fed","Bag":"#c67d10","Office Supplies":"#6d4ab7","Award and Trophy":"#b08900","Technology":"#0f6e8f","Promotional and Other Gifts":"#d4537e","UAE National Day Collection":"#a32d2d","Football Edition":"#1a7a3f","Kids Collection":"#d85a30","Maison Valer":"#5f5e5a"};
const PRINT_METHODS=["Screen 1 color","Screen 2 color","Screen Full color","UV DTF","UV Printing","Heat Transfer (DTF)","Engraving"];
const $=id=>document.getElementById(id);
let CATALOG=[], filtered=[], shown=0, PAGE=40, activeCat="all", setup={};
try{setup=JSON.parse(localStorage.getItem("ko_setup")||"{}");}catch(e){setup={};}

function reloadSetup(){try{setup=JSON.parse(localStorage.getItem("ko_setup")||"{}");}catch(e){setup={};}}
function load(){
  CATALOG=CATALOG_DATA.map(r=>({sku:r[0],name:r[1],category:r[2],subType:r[3],price:r[4],stock:r[5]}));
  reloadSetup();
  renderChips(); renderStats(); apply();
  // re-read saved setups when returning from the editor
  window.addEventListener("focus",()=>{reloadSetup();renderStats();apply(true);});
  // simulate the daily website auto-refresh (stock changes)
  setInterval(simRefresh, 12000);
}
function simRefresh(){
  // mimic inventory update from website backend
  let changed=0;
  CATALOG.forEach(p=>{if(Math.random()<0.04){p.stock=Math.max(0,p.stock+Math.round((Math.random()-0.4)*40));changed++;}});
  const t=new Date().toLocaleTimeString();
  $("syncLabel").textContent=`Synced with website · ${changed} stock updates · ${t}`;
  renderStats(); apply(true);
}
function readyCount(){return Object.keys(setup).length;}
let curFilter="all"; // all | ready | pending | instock
function renderStats(){
  const inStock=CATALOG.filter(p=>p.stock>0).length;
  const cards=[
    ["all","Products fetched",CATALOG.length,""],
    ["ready","Customization ready",readyCount(),"ok-on"],
    ["pending","Setup pending",CATALOG.length-readyCount(),"warn-on"],
    ["instock","In stock",inStock,""],
  ];
  $("stats").innerHTML=cards.map(c=>`<div class="stat click ${curFilter===c[0]?"on "+c[3]:""}" data-f="${c[0]}"><div class="n">${c[2].toLocaleString()}</div><div class="l">${c[1]}</div></div>`).join("");
  $("stats").querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{curFilter=el.dataset.f;if($("statusSel"))$("statusSel").value=(curFilter==="instock"||curFilter==="all"?"all":curFilter);renderStats();apply();});
}
function renderChips(){
  const cats=["all",...Array.from(new Set(CATALOG.map(p=>p.category)))];
  $("catChips").innerHTML=cats.map(c=>`<div class="chip ${c===activeCat?"on":""}" data-c="${c}">${c==="all"?"All categories":c}</div>`).join("");
  $("catChips").querySelectorAll("[data-c]").forEach(ch=>ch.onclick=()=>{activeCat=ch.dataset.c;renderChips();apply();});
}
function apply(keepShown){
  const q=$("q").value.trim().toLowerCase();
  const sort=$("sortSel").value;
  filtered=CATALOG.filter(p=>{
    if(activeCat!=="all"&&p.category!==activeCat)return false;
    if(curFilter==="ready"&&!setup[p.sku])return false;
    if(curFilter==="pending"&&setup[p.sku])return false;
    if(curFilter==="instock"&&!(p.stock>0))return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)))return false;
    return true;
  });
  filtered.sort((a,b)=>sort==="price"?b.price-a.price:sort==="stock"?b.stock-a.stock:a.name.localeCompare(b.name));
  if(!keepShown)shown=Math.min(PAGE,filtered.length);
  renderGrid();
}
function renderGrid(){
  $("grid").innerHTML=filtered.slice(0,shown).map(p=>{
    const col=CAT_COLORS[p.category]||"#5f5e5a", ready=!!setup[p.sku];
    const init=p.name.split(" ").slice(0,1)[0].slice(0,2).toUpperCase();
    return `<div class="card ${ready?"ko-ready":"ko-pending"}" data-sku="${p.sku}">
      <div class="thumb" style="background:color-mix(in srgb,${col} 16%,transparent);color:${col}">${init}</div>
      <h4>${p.name}</h4>
      <div class="meta"><span class="sku">${p.sku}</span><span class="badge ${ready?"b-ready":"b-pending"}">${ready?"✓ Ready":"Needs setup"}</span></div>
      <div class="meta"><span class="price">AED ${p.price}</span><span class="stock" style="color:${p.stock>0?"var(--ok)":"var(--muted)"}">${p.stock>0?p.stock+" in stock":"Out of stock"}</span></div>
      <div class="cardact">${ready?`<a class="ko-prev" data-prev="${p.sku}">Preview as customer ↗</a><span class="ko-edit">Edit setup</span>`:`<span class="ko-edit">Set up →</span>`}</div>
    </div>`;}).join("");
  $("grid").querySelectorAll("[data-sku]").forEach(c=>c.onclick=()=>openSetup(c.dataset.sku));
  $("grid").querySelectorAll(".ko-prev").forEach(a=>a.onclick=e=>{e.stopPropagation();const sku=a.dataset.prev,p=CATALOG.find(x=>x.sku===sku)||{};window.open("/multi-area-studio.html?api=/api&sku="+encodeURIComponent(sku)+"&name="+encodeURIComponent(p.name||""),"_blank");});
  $("moreBtn").style.display=shown<filtered.length?"inline-flex":"none";
  $("moreBtn").textContent=`Load more (${filtered.length-shown} left)`;
}
function openSetup(sku){
  const p=CATALOG.find(x=>x.sku===sku); if(!p)return;
  // Open the FULL setup editor for this product (upload images -> dimensions ->
  // mark print area -> methods -> pricing -> save). Pre-loads name + B2C price.
  const url="/part-setup.html?api=/api&sku="+encodeURIComponent(sku)+"&name="+encodeURIComponent(p.name)+"&price="+encodeURIComponent(p.price)+"&cat="+encodeURIComponent(p.category);
  const target=window.top&&window.top!==window?window.top:window;
  try{target.location.href=url;}catch(e){try{window.location.href=url;}catch(e2){}}
}
$("q").addEventListener("input",()=>apply());
$("statusSel").addEventListener("change",()=>{curFilter=$("statusSel").value;renderStats();apply();});
$("sortSel").addEventListener("change",()=>apply());
$("moreBtn").addEventListener("click",()=>{shown=Math.min(shown+PAGE,filtered.length);renderGrid();});
load();
</script>
