<title>Design Studio</title>
<script>try{document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Customer studio for products with MULTIPLE printable parts. Each part has its own
   material, allowed methods and price; the final total sums every printed part. */
:root{--bg:#eef2f8;--surface:#fff;--panel:#f6f9fd;--ink:#0f2748;--ink-soft:#3f5570;--muted:#7688a0;--border:#dce4ef;--border-strong:#c3d0e2;--accent:#2f6fed;--accent-ink:#fff;--boundary:#e24b4a;--ok:#1a9b73;--warn:#c67d10;--danger:#d84a48;--radius:9px;--ui:"Inter",system-ui,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1320;--surface:#111d2e;--panel:#0e1927;--ink:#e8eef8;--ink-soft:#b2c2d8;--muted:#7e92ac;--border:#213349;--border-strong:#2d445f;--accent:#4d8bf0;--accent-ink:#0a1320;--boundary:#ff5d5a;--ok:#3cce9f;--warn:#e0a53f;--danger:#ff6b68;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0a1320;--surface:#111d2e;--panel:#0e1927;--ink:#e8eef8;--ink-soft:#b2c2d8;--muted:#7e92ac;--border:#213349;--border-strong:#2d445f;--accent:#4d8bf0;--accent-ink:#0a1320;--boundary:#ff5d5a;--ok:#3cce9f;--warn:#e0a53f;--danger:#ff6b68;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pinfo{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.pinfo b{font-size:15px}.pinfo span{font-size:12px;color:var(--muted);display:block}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
button.ghost{background:transparent}
.work{display:grid;grid-template-columns:62px 1fr 310px;gap:12px;align-items:start}
@media(max-width:920px){.work{grid-template-columns:1fr}}
.rail{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
@media(max-width:920px){.rail{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px}}
.tool{width:46px;height:46px;border-radius:10px;border:1px solid transparent;background:var(--panel);color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:9px;font-weight:500}
.tool:hover{border-color:var(--accent);color:var(--accent)}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.stagewrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;min-width:0}
.parttabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.ptab{font-size:12.5px;padding:7px 13px;border-radius:9px;border:1px solid var(--border-strong);background:var(--panel);cursor:pointer;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px}
.ptab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ptab .pd{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ptab .pd.set{background:var(--ok)}
.ptab.on .pd.set{background:#fff}
.stage{display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:10px;overflow:auto}
.caption{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.canvas-shell{line-height:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;min-width:0}
.panel h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--panel);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--border-strong);border-radius:7px;background:var(--panel)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);cursor:pointer}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1}
.divider{height:1px;background:var(--border);margin:13px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--panel);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin:6px 0}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.matpill{font-size:11px;padding:2px 8px;border-radius:100px;background:var(--panel);border:1px solid var(--border-strong);color:var(--ink-soft)}
.pms{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ink-soft);margin-top:6px;padding:2px 7px;border:1px solid var(--border-strong);border-radius:5px;background:var(--panel)}
.pms i{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.cbtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:7px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;font-weight:600}
.cbtn i{width:20px;height:20px;border-radius:5px;background:var(--c);border:1px solid rgba(0,0,0,.2);flex:none}
.cbtn small{margin-left:auto;color:var(--muted);font-weight:500;font-size:10.5px}
.cbtn:hover{border-color:var(--accent)}
.fontpick{position:relative}
.fontpick input{width:100%}
.fontlist{display:none;position:absolute;left:0;right:0;top:100%;z-index:40;margin-top:4px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.fontlist.open{display:block}
.fitem{padding:8px 11px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--ink)}
.fitem:hover{background:var(--panel)}.fitem.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}.fitem.muted{color:var(--muted);font-size:12px;cursor:default}
.cpick{display:none;position:fixed;z-index:9999;width:234px;padding:12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
.cp-top{display:flex;gap:8px}
#cpSV{border-radius:7px;cursor:crosshair;touch-action:none;position:relative}
#cpHue{border-radius:5px;cursor:ns-resize;touch-action:none}
.cp-svwrap,.cp-huewrap{position:relative}
#cpDot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-6px,-6px);pointer-events:none}
#cpHueDot{position:absolute;left:-2px;right:-2px;height:4px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translateY(-3px);pointer-events:none;border-radius:2px}
.cp-prev{display:flex;align-items:center;gap:8px;margin:10px 0 8px;font-size:12px;font-weight:600;color:var(--ink)}
#cpSw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
.cp-cmyk{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.cp-cmyk label{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--muted);gap:2px}
.cp-cmyk input{width:100%;padding:4px 2px;text-align:center;font-size:12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--panel);color:var(--ink)}
.cp-cmyk-note{font-size:10px;color:var(--muted);margin-top:5px}
.cp-pms{margin-top:8px}
.cp-actions{margin-top:9px;text-align:right}
.cp-actions button{padding:6px 16px}
.sumbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-top:10px}
.sumbox .l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin:3px 0}
.sumbox .l small{color:var(--muted)}
.sumbox .t{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.statusbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:12.5px}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--warn)}
.tag{font-weight:600}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}
.filechip{display:none}
dialog{border:none;border-radius:16px;padding:0;max-width:min(640px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(8,18,34,.34)}
dialog::backdrop{background:rgba(8,18,34,.5)}
.modal{padding:18px;max-height:86vh;overflow:auto}
.modal h2{font-size:17px;margin:0 0 4px}.modal p{font-size:13px;color:var(--muted);margin:0 0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.checker{background-image:linear-gradient(45deg,#c9d3e0 25%,transparent 25%),linear-gradient(-45deg,#c9d3e0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9d3e0 75%),linear-gradient(-45deg,transparent 75%,#c9d3e0 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border-radius:8px;padding:8px;display:flex;justify-content:center;align-items:center}
.checker img{max-width:100%;max-height:150px}
.minlbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;text-align:center}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.partcard{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.partcard h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* hover tooltip */
#tip{position:fixed;z-index:9000;max-width:230px;background:#0f2748;color:#ffffff;border:1px solid rgba(255,255,255,.16);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(8,18,34,.5);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .14s,transform .14s}
#tip.on{opacity:1;transform:translateY(0)}
#tip b{color:#9ec3ff}
#tip:after{content:"";position:absolute;width:8px;height:8px;background:#0f2748;transform:rotate(45deg)}
#tip.below:after{top:-4px;left:var(--ax,16px)}
#tip.above:after{bottom:-4px;left:var(--ax,16px)}
/* guided tour */
#tourScrim{position:fixed;inset:0;z-index:8000;display:none}
#tourScrim.on{display:block}
#tourHole{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,18,34,.62);transition:all .25s ease;pointer-events:none}
#tourBub{position:absolute;z-index:8100;width:min(300px,86vw);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:0 18px 50px rgba(8,18,34,.4);transition:all .25s ease}
#tourBub h4{margin:0 0 5px;font-size:14px;color:var(--ink)}
#tourBub p{margin:0 0 12px;font-size:13px;color:var(--ink-soft);line-height:1.5}
#tourBub .trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#tourBub .dots{display:flex;gap:5px}
#tourBub .dt{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
#tourBub .dt.on{background:var(--accent)}
#tourBub .tb{font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer}
#tourBub .tb.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tourBub .skip{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none}
.help-btn{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
</style>

<div class="wrap">
  <div class="top">
    <div class="pinfo"><div class="logo" id="koLogo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 1 6 0c0 1.5-1.2 2.3-1.8 3.2-.4.6-.2 1.3.3 1.6l3.2 1.8c.6.3 1 .9 1 1.6V17H6v-1.8c0-.7.4-1.3 1-1.6l3.2-1.8c.5-.3.7-1 .3-1.6C9.2 8.3 9 7.5 9 6z"/><rect x="5" y="18" width="14" height="3" rx="1"/></svg></div><div><b id="pName">Loading…</b><span id="pMeta"></span></div></div>
    <div class="actions">
      <button id="btnHelp" class="ghost help-btn" aria-label="Help" data-tip="<b>Need a hand?</b> Replay the quick tour of how to personalize this product.">?</button>
      <button id="btnClear" class="ghost" data-tip="<b>Clear this section</b> — remove all artwork from the section you're on. Other sections stay.">Clear this section</button>
      <button id="btnReview" class="primary" data-tip="<b>Review &amp; add to cart</b> — see your design on the product and the final price, then add it.">Review & add to cart</button>
    </div>
  </div>
  <div class="work">
    <div class="rail" id="rail">
      <button class="tool" id="tText" data-tip="<b>Text</b> — add your own words. Pick the font, size, colour and alignment after."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 6h16M12 6v13M8 19h8"/></svg>Text</button>
      <button class="tool" id="tLogo" data-tip="<b>Logo / photo</b> — upload your own image (PNG or JPG). A white background is removed for you."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>Logo</button>
      <button class="tool" id="tRect" data-tip="<b>Box</b> — add a rectangle shape."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>Box</button>
      <button class="tool" id="tSquare" data-tip="<b>Square</b> — add a square shape."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>Square</button>
      <button class="tool" id="tCircle" data-tip="<b>Circle</b> — add a circle shape."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Circle</button>
      <button class="tool" id="tTri" data-tip="<b>Triangle</b> — add a triangle. Corners can be rounded."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></svg>Triangle</button>
      <button class="tool" id="tLine" data-tip="<b>Line</b> — add a straight line / divider."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 12h16"/></svg>Line</button>
      <button class="tool" id="tHeart" data-tip="<b>Heart</b> — add a heart shape."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Heart</button>
      <button class="tool" id="tDup" data-tip="<b>Copy</b> — duplicate the selected element."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></svg>Copy</button>
      <button class="tool" id="tDel" data-tip="<b>Delete</b> — remove the selected element (or press Delete)."><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete</button>
    </div>
    <div class="stagewrap">
      <div class="parttabs" id="partTabs"></div>
      <div class="stage" id="stage"><div class="canvas-shell"><canvas id="c"></canvas></div></div>
      <div class="caption" id="caption">Pick a section to design. You only pay for the sections you print.</div>
    </div>
    <div class="panel" id="inspector"></div>
  </div>
  <div class="statusbar">
    <span class="stat" data-tip="<b>Fit check</b> — tells you if your artwork sits inside the printable area and if an uploaded logo is sharp enough."><span class="dot" id="dFit"></span><span id="sFit">Design inside the print area</span></span>
    <span class="stat" data-tip="<b>Print area</b> — the real size and material of the section you're designing."><span id="sArea">—</span></span>
    <span class="stat" data-tip="<b>Live price</b> — updates as you add artwork, pick a finish and change quantity. This is your final total."><span id="sPrice" style="font-weight:700">—</span></span>
  </div>
</div>

<div id="tip"></div>
<div id="tourScrim"><div id="tourHole"></div></div>
<div id="tourBub"></div>

<input type="file" id="fileLogo" accept="image/*" class="filechip">

<dialog id="outDlg"><div class="modal">
  <h2>Review your gift</h2>
  <p>Here's each printed section and your final price. You only pay for the sections you designed.</p>
  <div id="outGallery"></div>
  <div class="sumbox" id="outPrice"></div>
  <div class="modal-actions"><button id="btnClose">Back</button><button id="btnSVG" data-tip="<b>Vector artwork</b> — text &amp; shapes as scalable vectors (SVG), logos embedded.">Download vector (SVG)</button><button id="btnPDF" data-tip="<b>Production sheet</b> — every element with font, size &amp; Pantone, per section.">Artwork spec (PDF)</button><button class="primary" id="btnCart">Add to cart</button></div>
</div></dialog>

<div id="cpick" class="cpick">
  <div class="cp-top">
    <div class="cp-svwrap"><canvas id="cpSV" width="178" height="140"></canvas><span id="cpDot"></span></div>
    <div class="cp-huewrap"><canvas id="cpHue" width="18" height="140"></canvas><span id="cpHueDot"></span></div>
  </div>
  <div class="cp-prev"><span id="cpSw"></span><span id="cpHex">#000000</span></div>
  <div class="cp-cmyk">
    <label>C<input type="number" id="cpC" min="0" max="100"></label>
    <label>M<input type="number" id="cpM" min="0" max="100"></label>
    <label>Y<input type="number" id="cpY" min="0" max="100"></label>
    <label>K<input type="number" id="cpK" min="0" max="100"></label>
  </div>
  <div class="cp-cmyk-note">CMYK — the print colour model. Pick from the wheel or type values.</div>
  <div class="cp-pms" id="cpPms"></div>

function orderPrice(){const r=n=>Math.round(n*100)/100,qty=Math.max(1,state.qty);const parts=P.map(partPrint).filter(Boolean);const printTotal=r(parts.reduce((s,x)=>s+x.total,0));const card=state.card.enabled?4*qty:0;const productTotal=r(PRODUCT.base*qty);const sub=r(productTotal+printTotal+card);const delivery=PRODUCT.delivery||0;const total=r(sub+delivery);return {qty,parts,printTotal,card,productTotal,delivery,sub,total,perPiece:r(total/qty)};}

function priceRows(pr,productLabel){const lines=pr.parts.map(p=>`<div class="l"><span>${p.label} <small>· ${p.method.group} ${p.method.label} · ${SIZE_LABELS[p.size]||p.size} · ${p.els} element${p.els>1?"s":""}</small></span><span>${CUR} ${p.total.toFixed(2)}</span></div>`).join("")||`<div class="l"><span>No sections printed yet</span><span>—</span></div>`;return `<div class="l"><span>${productLabel} × ${pr.qty}</span><span>${CUR} ${pr.productTotal.toFixed(2)}</span></div>${lines}${state.card.enabled?`<div class="l"><span>Message card × ${pr.qty}</span><span>${CUR} ${pr.card.toFixed(2)}</span></div>`:""}${pr.delivery?`<div class="l"><span>Delivery</span><span>${CUR} ${pr.delivery.toFixed(2)}</span></div>`:""}<div class="t"><span>Total <small>(excl. VAT)</small></span><span>${CUR} ${pr.total.toFixed(2)}</span></div><div class="l"><span><small>≈ per piece</small></span><span><small>${CUR} ${pr.perPiece.toFixed(2)}</small></span></div><div class="l" style="margin-top:2px"><span><small style="color:var(--muted)">VAT is added at checkout in your cart.</small></span><span></span></div>`;}

function updateStatus(){$("sArea").textContent=`${curDef().label} · ${prW()}×${prH()} mm · ${curDef().material}`;const imgs=dObjs().filter(o=>o.type==="image");if(imgs.length){const mpp=prW()/cur().area.width;let worst=99;imgs.forEach(im=>{const nat=(im._originalElement&&im._originalElement.naturalWidth)||im.width;worst=Math.min(worst,nat/(im.getScaledWidth()*mpp/25.4*curDef().dpi));});if(worst>=1){$("dRes")&&0;$("dFit").className="dot";$("sFit").innerHTML='<span class="tag ok">Looks good</span>';}else{$("dFit").className="dot warn";$("sFit").innerHTML='<span class="tag warn">Logo may print blurry</span>';}}else{$("dFit").className="dot";$("sFit").textContent="Add artwork to this section";}const pr=orderPrice();$("sPrice").textContent=`${CUR} ${pr.total.toFixed(2)}`;}
function updateCaption(){$("caption").textContent=curDef().type==="cylinder"?`${curDef().label}: design the 360° wrap — printed around the body.`:`${curDef().label}: design inside the print area.`;}

  } else if(o.type==="image"){

function groupOf(ids){const g=[];ids.forEach(id=>{const m=methodById(id);if(!m)return;let x=g.find(y=>y.group===m.group);if(!x){x={group:m.group,items:[]};g.push(x);}x.items.push(m);});return g;}
function applySpots(){if(optLimit()!==1)return;const sp=cur().spots[0];dObjs().forEach(o=>{if(o.type!=="image")o.set("fill",sp);});canvas.requestRenderAll();}

  if(state.colorErr)h+=`<div style="font-size:11.5px;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border:1px solid var(--danger);border-radius:8px;padding:7px 9px;margin-top:8px">⚠ ${state.colorErr}</div>`;
  cr.innerHTML=h;

  const cardRow=$("cardRow");if(state.card.enabled){cardRow.innerHTML=`<div class="field"><label>Card message</label><input type="text" id="cardMsg" value="${(state.card.text||"").replace(/"/g,'&quot;')}" placeholder="Happy Birthday!"></div>`;$("cardMsg").oninput=e=>{state.card.text=e.target.value;};}else cardRow.innerHTML="";
  if($("qty"))$("qty").onchange=e=>{state.qty=Math.max(1,parseInt(e.target.value)||1);refreshInspector();};
  if($("cardChk"))$("cardChk").onchange=e=>{state.card.enabled=e.target.checked;refreshInspector();};
  drawSummary();
}
function drawSummary(){const pr=orderPrice(),b=$("sumBox");if(!b)return;b.innerHTML=priceRows(pr,"Product");updateStatus();}
function swatches(id,cb,pal){const box=$(id);if(!box)return;box.innerHTML="";(pal||SW).forEach(c=>{const s=document.createElement("div");s.className="sw";s.style.background=c;s.onclick=()=>cb(c);box.appendChild(s);});}
function hex(c){if(!c)return"#000000";if(c[0]==="#")return c.length===4?"#"+[...c.slice(1)].map(x=>x+x).join(""):c;const m=c.match(/\d+/g);if(!m)return"#000000";return"#"+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("");}

/* ---- effects + preview ---- */
function applyEffect(src,p){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);const m=methodById(p.method);if(!m){res(src);return;}const d=x.getImageData(0,0,c.width,c.height),q=d.data;if(m.effect==="engrave"){const mat=p.def.material,wood=(mat==="wood"||mat==="bamboo"),leather=(mat==="leather"),glass=(mat==="crystal"||mat==="glass"),stone=(mat==="stone"||mat==="ceramic");for(let i=0;i<q.length;i+=4){if(q[i+3]<10)continue;const g=0.3*q[i]+0.59*q[i+1]+0.11*q[i+2],t=(255-g)/255;if(glass){/* frosted glass mark — bright white etch */q[i]=235;q[i+1]=240;q[i+2]=245;q[i+3]=Math.round(t*200)+30;}else if(wood){/* bamboo / wood — warm burnt brown */q[i]=Math.round(74+t*46);q[i+1]=Math.round(44+t*28);q[i+2]=Math.round(18+t*10);q[i+3]=Math.round(t*255);}else if(leather){/* leather deboss — dark burnished */q[i]=Math.round(40+t*30);q[i+1]=Math.round(28+t*20);q[i+2]=Math.round(18+t*12);q[i+3]=Math.round(t*255);}else if(stone){/* stone / ceramic — pale etch */q[i]=q[i+1]=q[i+2]=Math.round(210+t*25);q[i+3]=Math.round(t*220);}else{/* metal — brushed steel mark */const s=Math.round(150+t*50);q[i]=s;q[i+1]=s+4;q[i+2]=s+10;q[i+3]=Math.round(t*255);}}}else if(m.effect==="ink"&&m.limit>0){const sp=p.spots.slice(0,m.limit).map(h=>{const s=h.replace("#","");return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}).sort((a,b)=>(0.3*a[0]+0.59*a[1]+0.11*a[2])-(0.3*b[0]+0.59*b[1]+0.11*b[2]));for(let i=0;i<q.length;i+=4){if(q[i+3]<10)continue;const g=0.3*q[i]+0.59*q[i+1]+0.11*q[i+2];const col=sp.length===1?sp[0]:(g<128?sp[0]:sp[sp.length-1]);q[i]=col[0];q[i+1]=col[1];q[i+2]=col[2];}}x.putImageData(d,0,0);res(c.toDataURL());};im.onerror=()=>res(src);im.src=src;});}
function curveCanvas(src){const W=src.width,H=src.height,out=document.createElement("canvas");out.width=W;out.height=H;const ctx=out.getContext("2d");for(let x=0;x<W;x++){const u=x/(W-1),su=(Math.asin(2*u-1)/Math.PI)+0.5,sx=Math.max(0,Math.min(W-1,su*W));ctx.drawImage(src,sx,0,1,H,x,0,1,H);}const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,"rgba(0,0,0,.22)");g.addColorStop(.5,"rgba(255,255,255,.04)");g.addColorStop(1,"rgba(0,0,0,.22)");ctx.globalCompositeOperation="source-atop";ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="source-over";return out;}
function previewPart(bImg,artImg,n,k,tf,hf){const Wp=Math.min(200,bImg.width),sc=Wp/bImg.width,Hp=Math.round(bImg.height*sc);const c=document.createElement("canvas");c.width=Wp;c.height=Hp;const ctx=c.getContext("2d");ctx.drawImage(bImg,0,0,Wp,Hp);let art=artImg;if(n>1){const sw=Math.max(1,Math.floor(artImg.width/n)),sx=Math.floor(artImg.width*k/n);const sl=document.createElement("canvas");sl.width=sw;sl.height=artImg.height;sl.getContext("2d").drawImage(artImg,sx,0,sw,artImg.height,0,0,sw,artImg.height);art=curveCanvas(sl);}const layer=document.createElement("canvas");layer.width=Wp;layer.height=Hp;const lx=layer.getContext("2d");lx.drawImage(art,0,Hp*tf,Wp,Hp*hf);lx.globalCompositeOperation="destination-in";lx.drawImage(bImg,0,0,Wp,Hp);ctx.drawImage(layer,0,0);return c.toDataURL();}
function renderPartArt(p){return new Promise(res=>{const mult=mm2px(partW(p),p.def.dpi)/p.area.width;const sc=new fabric.StaticCanvas(null,{width:canvas.width,height:canvas.height,enableRetinaScaling:false});const clp=new fabric.Rect({left:p.area.left,top:p.area.top,width:p.area.width,height:p.area.height,absolutePositioned:true});fabric.util.enlivenObjects(p.design||[],objs=>{objs.forEach(o=>{o.clipPath=clp;sc.add(o);});sc.renderAll();res(sc.toDataURL({format:"png",left:p.area.left,top:p.area.top,width:p.area.width,height:p.area.height,multiplier:mult}));});});}

async function review(){
  persistPart();const gal=$("outGallery");gal.innerHTML="";
  for(const p of P){
    if(!p.design||!p.design.length)continue;
    const raw=await renderPartArt(p),art=await applyEffect(raw,p);
    let body;
    if(p.def.type==="cylinder"){const ai=await loadHTMLImg(art);const tf=(p.area.top-p.cylPack.top)/p.cylPack.imgH,hf=p.area.height/p.cylPack.imgH;const bi=await loadHTMLImg(await autoCrop(await rmWhite(p.def.images.front)));body=`<div class="checker" style="background:#eef2f8"><img src="${previewPart(bi,ai,3,1,tf,hf)}"></div>`;}
    else{const ai=await loadHTMLImg(art);const bi=await loadHTMLImg(await autoCrop(await rmWhite(p.def.images.front)));const Wp=Math.min(200,bi.width),Hp=Math.round(bi.height*Wp/bi.width);const tf=(p.area.top-(canvasTop(bi)))/(Hp);body=`<div class="checker" style="background:#eef2f8"><img src="${flatPreview(bi,ai,p)}"></div>`;}
    const m=methodById(p.method);
    const blk=document.createElement("div");blk.className="partcard";blk.innerHTML=`<h4>${p.def.label} <span class="matpill">${p.def.material} · ${m.group} ${m.label}</span></h4>${body}`;gal.appendChild(blk);
  }
  if(!gal.children.length)gal.innerHTML=`<div class="hint" style="text-align:center;padding:14px">No sections designed yet — add artwork to at least one section.</div>`;
  const pr=orderPrice();
  $("outPrice").innerHTML=priceRows(pr,PRODUCT.name);
  $("outDlg").showModal();
}
function canvasTop(bi){return 0;}
function flatPreview(bi,ai,p){const Wp=Math.min(200,bi.width),sc=Wp/bi.width,Hp=Math.round(bi.height*sc);const c=document.createElement("canvas");c.width=Wp;c.height=Hp;const ctx=c.getContext("2d");ctx.drawImage(bi,0,0,Wp,Hp);
  // place art centered where the lid print area maps (center of disc)
  const aw=Wp*0.4,ah=aw*(ai.height/ai.width),ax=(Wp-aw)/2,ay=(Hp-ah)/2;
  const layer=document.createElement("canvas");layer.width=Wp;layer.height=Hp;const lx=layer.getContext("2d");lx.drawImage(ai,ax,ay,aw,ah);lx.globalCompositeOperation="destination-in";lx.drawImage(bi,0,0,Wp,Hp);ctx.drawImage(layer,0,0);return c.toDataURL();}

/* ===== Final artwork output — vector SVG + production spec PDF with Pantone ===== */
function dlBlob(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shrinkPNG(u,maxW){return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,maxW/im.width);const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/png"));};im.onerror=()=>r(u);im.src=u;});}
/* one section → fabric SVG already scaled into real mm user units */
function sectionSVGmm(p){return new Promise(res=>{const aw=p.area.width,wmm=partW(p),hmm=partH(p),k=wmm/aw;const sc=new fabric.StaticCanvas(null,{width:wmm,height:hmm,enableRetinaScaling:false});fabric.util.enlivenObjects(p.design||[],objs=>{objs.forEach(o=>{o.clipPath=null;o.left=(o.left-p.area.left)*k;o.top=(o.top-p.area.top)*k;o.scaleX=(o.scaleX||1)*k;o.scaleY=(o.scaleY||1)*k;o.setCoords&&o.setCoords();sc.add(o);});sc.renderAll();res({svg:sc.toSVG(),wmm,hmm});});});}
async function buildVectorSVG(){persistPart();const secs=[];for(const p of P){if(p.design&&p.design.length)secs.push({label:p.def.label,...(await sectionSVGmm(p))});}if(!secs.length)return null;let y=0,W=0,body="";const lblH=6,gap=9;secs.forEach(s=>{const inner=s.svg.replace(/^[\s\S]*?<svg[^>]*>/,"").replace(/<\/svg>\s*$/,"");body+=`<text x="0" y="${(y+4).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="3.4" fill="#333">${esc(s.label)} — ${s.wmm}×${s.hmm} mm</text>`;body+=`<g transform="translate(0,${(y+lblH).toFixed(1)})">${inner}</g>`;y+=s.hmm+lblH+gap;W=Math.max(W,s.wmm);});return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}mm" height="${y.toFixed(1)}mm" viewBox="0 0 ${W} ${y.toFixed(1)}">${body}</svg>`;}
async function downloadSVG(){const svg=await buildVectorSVG();if(!svg){alert("Design at least one section first.");return;}dlBlob("artwork-"+PRODUCT.sku+".svg",svg,"image/svg+xml");}
/* element spec per printed section (font, size mm, colour, Pantone, DPI) */
function elementSpecs(){persistPart();const out=[];for(const p of P){if(!p.design||!p.design.length)continue;const m=methodById(p.method),wmm=partW(p),k=wmm/p.area.width;const items=p.design.map(o=>{if(o.type==="i-text"||o.type==="text"){const sizemm=o.fontSize*(o.scaleY||1)*k,hx=hex(o.fill),pm=nearestPantone(hx);return {type:"Text",detail:'"'+(o.text||"")+'"',sub:"Font "+o.fontFamily+(o.fontWeight==="bold"?" Bold":"")+" · "+sizemm.toFixed(1)+" mm · "+hx.toUpperCase()+" · "+cmykLabel(hx)+" · PANTONE "+pm.code};}if(o.type==="image"){const dpi=Math.round(25.4/((o.scaleX||1)*k));return {type:"Image",detail:"Uploaded logo (raster)",sub:"Print as supplied · approx "+dpi+" DPI at size"+(dpi<300?" — below 300, may print soft":"")};}const hx=hex(o.fill),pm=nearestPantone(hx),nm=SHAPE_NAME[o.koShape]||"Shape";return {type:"Shape",detail:nm,sub:hx.toUpperCase()+" · "+cmykLabel(hx)+" · PANTONE "+pm.code};});out.push({label:p.def.label,material:p.def.material,method:m.group+" "+m.label,wmm,hmm:partH(p),dpi:p.def.dpi,items,_p:p});}return out;}
async function downloadPDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){alert("PDF engine didn't load (are you offline?). The SVG vector export still works.");return;}
  const specs=elementSpecs();if(!specs.length){alert("Design at least one section first.");return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),L=14;let y=16;
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("Artwork Production Sheet",L,y);y+=6;
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);
  doc.text(PRODUCT.name+"  ·  SKU "+PRODUCT.sku,L,y);y+=4;doc.text("Generated "+new Date().toLocaleString(),L,y);y+=7;doc.setTextColor(20);
  for(const sec of specs){
    const raw=await renderPartArt(sec._p),prev=await shrinkPNG(await applyEffect(raw,sec._p),460);
    if(y>235){doc.addPage();y=16;}
    doc.setFillColor(15,39,72);doc.rect(L,y-4,182,7,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(10);
    doc.text(sec.label+"  —  "+sec.method,L+2,y+1);y+=9;doc.setTextColor(20);
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);
    doc.text("Material: "+sec.material+"     Print size: "+sec.wmm+" x "+sec.hmm+" mm     Output DPI: "+sec.dpi,L,y);
    const imgTop=y+3;let pw=40,ph=40*(sec._p.area.height/sec._p.area.width);
    try{doc.addImage(prev,"PNG",L,imgTop,pw,ph);doc.setDrawColor(210);doc.rect(L,imgTop,pw,ph);}catch(e){}
    let ty=imgTop,tx=L+48;
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text("Elements ("+sec.items.length+")",tx,ty);ty+=5;
    doc.setFont("helvetica","normal");doc.setFontSize(8.3);
    sec.items.forEach((it,i)=>{if(ty>285){doc.addPage();ty=16;tx=L+48;}doc.setTextColor(20);doc.text((i+1)+". "+it.type+" — "+it.detail,tx,ty);ty+=4.2;doc.setTextColor(110);doc.text("    "+it.sub,tx,ty);ty+=5;});
    y=Math.max(imgTop+ph,ty)+6;
  }
  if(y>280){doc.addPage();y=16;}
  doc.setFontSize(7.5);doc.setTextColor(130);
  doc.text("Pantone values are closest approximate matches (sRGB->PMS). Confirm against a physical Pantone book before production.",L,Math.min(y+2,292));
  doc.save("artwork-spec-"+PRODUCT.sku+".pdf");
}
/* ---- cart hand-off: pass product + printing lines (ex-VAT) to the store; the store applies VAT at checkout ---- */
async function addToCart(){
  const pr=orderPrice();
  const items=[{type:"product",sku:PRODUCT.sku,name:PRODUCT.name,qty:pr.qty,unitPrice:PRODUCT.base,lineTotal:pr.productTotal}];
  pr.parts.forEach(p=>items.push({type:"printing",section:p.label,method:`${p.method.group} ${p.method.label}`,size:SIZE_LABELS[p.size]||p.size,elements:p.els,setup:p.setup,unitPrice:p.unit,qty:pr.qty,lineTotal:p.total}));
  if(state.card.enabled)items.push({type:"message-card",qty:pr.qty,lineTotal:pr.card});
  const artwork=[];for(const p of P){if(p.design&&p.design.length){try{artwork.push({section:p.def.label,png:await renderPartArt(p)});}catch(e){}}}
  let vector=null;try{vector=await buildVectorSVG();}catch(e){}
  const spec=elementSpecs().map(s=>({section:s.label,material:s.material,method:s.method,printSizeMm:[s.wmm,s.hmm],elements:s.items}));
  const payload={event:"add_to_cart",sku:PRODUCT.sku,name:PRODUCT.name,currency:CUR,quantity:pr.qty,items,subtotalExVat:pr.sub,delivery:pr.delivery,totalExVat:pr.total,note:"VAT is applied by the store at checkout",artwork,artworkVectorSvg:vector,artworkSpec:spec};
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:"IMPRINT_ADD_TO_CART",payload},"*");}catch(e){}
  try{localStorage.setItem("ko_cart",JSON.stringify(payload));}catch(e){}
  console.log("[Imprint Studio] add-to-cart →",payload);
  $("outDlg").close();$("btnReview").textContent="✓ Added to cart";setTimeout(()=>$("btnReview").textContent="Review & add to cart",1800);
}
/* ---- product loader: the customer studio never defines a product; it receives one by SKU ----
   Priority: ?cfg= (base64 JSON) › localStorage ko_product_<sku> (saved by the Product Manager) › window.IMPRINT_PRODUCT (host embed) › demo. */
function phImg(type){const s=type==="cylinder"?`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='430'><rect width='320' height='430' fill='#fff'/><rect x='112' y='40' width='96' height='360' rx='26' fill='#f1f4f8' stroke='#cdd6e2' stroke-width='3'/></svg>`:`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='240'><rect width='320' height='240' fill='#fff'/><rect x='58' y='46' width='204' height='148' rx='14' fill='#f1f4f8' stroke='#cdd6e2' stroke-width='3'/></svg>`;return "data:image/svg+xml;utf8,"+encodeURIComponent(s);}
/* adapt the admin Part-Setup cfg (ko_setup shape) into the studio PRODUCT shape */
function adaptSetup(s){const parts=(s.parts||[]).map((p,i)=>{const img=phImg(p.type);const part={id:(p.label||("part"+i)).toLowerCase().replace(/[^a-z0-9]+/g,"-")||("p"+i),label:p.label||("Section "+(i+1)),material:p.material||"metal",type:p.type||"flat",dpi:p.dpi||300,safe:p.safe==null?4:p.safe,methods:(p.methods&&p.methods.length)?p.methods.slice():["uvflat"]};if(part.type==="cylinder"){part.images={front:img,left:img,right:img};part.productH=p.productH||200;part.dia=p.dia||50;part.printH=p.printH||80;part.bandPos=p.bandPos==null?0.55:p.bandPos;}else{part.images={front:img};part.realW=p.realW||80;part.realH=p.realH||60;}return part;});return {sku:s.sku,name:s.name,base:s.productBase==null?40:s.productBase,vatPct:s.vatPct==null?5:s.vatPct,delivery:s.delivery||0,perElement:s.perElement==null?2:s.perElement,methodPrices:s.prices||null,parts};}
function resolveProduct(demo){
  try{const q=new URLSearchParams(location.search);
    const cfg=q.get("cfg");if(cfg){const o=JSON.parse(decodeURIComponent(escape(atob(cfg))));if(o&&o.parts&&o.parts.length)return o;}
    const sku=q.get("sku");
    if(sku){const direct=localStorage.getItem("ko_product_"+sku);if(direct){const o=JSON.parse(direct);if(o&&o.parts&&o.parts.length)return o;}}
    if(sku){const all=JSON.parse(localStorage.getItem("ko_setup")||"{}");const s=all[sku];if(s&&s.parts&&s.parts.length)return adaptSetup(s);}
    if(window.IMPRINT_PRODUCT&&window.IMPRINT_PRODUCT.parts)return window.IMPRINT_PRODUCT;
    const api=q.get("api");if(api&&sku)console.log("[Imprint Studio] No saved setup for "+sku+". Connect your feed: GET "+api+"/product/"+sku+" should return this product's parts/methods.");
  }catch(e){}
  return demo;
}
function boot(){
  initCanvas();
  $("pName").textContent=PRODUCT.name;$("pMeta").textContent=`${PRODUCT.sku} · ${PRODUCT.parts.length} printable section${PRODUCT.parts.length>1?"s":""} · set up for you`;
  buildPart();
  $("fileLogo").onchange=e=>{if(e.target.files[0])addLogo(e.target.files[0]);e.target.value="";};
  $("tText").onclick=addText;$("tLogo").onclick=()=>$("fileLogo").click();
  $("tRect").onclick=()=>addShape("rect");$("tSquare").onclick=()=>addShape("square");$("tCircle").onclick=()=>addShape("circle");$("tTri").onclick=()=>addShape("triangle");
  $("tLine").onclick=()=>addShape("line");$("tHeart").onclick=()=>addShape("heart");
  $("tDel").onclick=()=>{const o=canvas.getActiveObject();if(o&&o.koRole==="design"){canvas.remove(o);refreshInspector();updateStatus();renderPartTabs();}};
  $("tDup").onclick=()=>{const o=canvas.getActiveObject();if(o&&o.koRole==="design")o.clone(cl=>{cl.set({left:o.left+16,top:o.top+16,clipPath:clip()});cl.koRole="design";canvas.add(cl);canvas.setActiveObject(cl);guides();refreshInspector();},["koRole"]);};
  $("btnClear").onclick=()=>{dObjs().forEach(o=>canvas.remove(o));refreshInspector();updateStatus();renderPartTabs();};
  $("btnReview").onclick=review;$("btnClose").onclick=()=>$("outDlg").close();
  $("btnSVG").onclick=downloadSVG;$("btnPDF").onclick=downloadPDF;
  $("btnCart").onclick=addToCart;
  // Light theme only (store site has no dark mode)
  document.documentElement.setAttribute("data-theme","light");
  // when opened standalone in the app (not embedded on a product page), the logo goes home
  try{if(window.self===window.top){const lg=$("koLogo");if(lg){lg.style.cursor="pointer";lg.title="Home";lg.onclick=()=>{location.href="/welcome.html";};}}}catch(e){}
  // keep the product/parts centered on the artboard on every screen size
  const refit=()=>{const st=$("stage");if(!st||!canvas)return;const w=Math.max(280,Math.min(760,st.clientWidth-2));if(Math.abs(w-canvas.getWidth())<2)return;const h=Math.round(w*0.62);persistPart();canvas.setWidth(w);canvas.setHeight(h);buildPart();};
  let _rz;const onResize=()=>{clearTimeout(_rz);_rz=setTimeout(refit,160);};
  window.addEventListener("resize",onResize);
  if(window.ResizeObserver){try{new ResizeObserver(onResize).observe($("stage"));}catch(e){}}
  setTimeout(refit,300);
  document.addEventListener("keydown",e=>{if((e.key==="Delete"||e.key==="Backspace")&&canvas){const o=canvas.getActiveObject();if(o&&o.koRole==="design"&&!o.isEditing){canvas.remove(o);refreshInspector();updateStatus();renderPartTabs();}}});
  document.fonts&&document.fonts.ready.then(()=>canvas.requestRenderAll());
  cpBind();
  document.addEventListener("pointerdown",e=>{if(!e.target.closest(".fontpick"))document.querySelectorAll(".fontlist.open").forEach(l=>l.classList.remove("open"));if(!e.target.closest(".cpick")&&!e.target.closest(".cbtn")&&$("cpick").style.display==="block")closeCP();},true);
  initTips();initInspectorTips();$("btnHelp").onclick=startTour;
  let done=false;try{done=localStorage.getItem("ko_tour_done")==="1";}catch(e){}
  if(!done)setTimeout(startTour,650);
}

/* ---------- hover tooltips (1s delay) ---------- */
let tipTimer=null,tipTarget=null;
function initTips(){
  document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t||t===tipTarget)return;tipTarget=t;clearTimeout(tipTimer);tipTimer=setTimeout(()=>showTip(t),900);});
  document.addEventListener("mouseout",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t){clearTimeout(tipTimer);hideTip();tipTarget=null;}});
  document.addEventListener("click",hideTip,true);window.addEventListener("scroll",hideTip,true);
}
function showTip(t){if(!t.isConnected||$("tourScrim").classList.contains("on"))return;const tip=$("tip");tip.innerHTML=t.dataset.tip;tip.className="on";const r=t.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2)),top;
  if(r.top-th-10>8){top=r.top-th-10;tip.classList.add("above");}else{top=r.bottom+10;tip.classList.add("below");}
  tip.style.left=left+"px";tip.style.top=top+"px";tip.style.setProperty("--ax",Math.max(10,Math.min(tw-18,r.left+r.width/2-left-4))+"px");}
function hideTip(){$("tip").classList.remove("on");}
/* auto-tag inspector controls as they re-render */
const INS_TIPS=[
  ["#qty","<b>Quantity</b> — how many you want. The price updates for the full quantity."],
  ["#cardChk","<b>Message card</b> — add a printed card with your wish for a small extra."],
];
function initInspectorTips(){tagInspector();const ins=$("inspector");if(ins)new MutationObserver(tagInspector).observe(ins,{childList:true,subtree:true});}
function tagInspector(){
  INS_TIPS.forEach(([sel,tip])=>{const el=document.querySelector(sel);if(el){const host=el.closest(".field")||el.parentElement||el;if(host&&!host.dataset.tip)host.dataset.tip=tip;}});
  document.querySelectorAll("#methodRows .chip").forEach(c=>{if(!c.dataset.tip)c.dataset.tip="<b>Print finish</b> — how this section is printed. Some finishes change the price.";});
  document.querySelectorAll("#inspector .swatches .sw").forEach(s=>{if(!s.dataset.tip)s.dataset.tip="<b>Colour</b> — recolour the selected text or shape.";});
  document.querySelectorAll("#partTabs .ptab").forEach(t=>{if(!t.dataset.tip)t.dataset.tip="<b>Section</b> — switch to design this section of the product. You only pay for printed sections.";});
}

/* ---------- guided tour ---------- */
let tStep=0,tArr=[];
function tourSteps(){
  const multi=(typeof P!=="undefined"&&P.length>1);let n=1;const s=[];
  s.push({el:"#rail",t:(n++)+". Add your artwork",d:"Add your text, upload your logo (PNG/JPG — background removed for you), or drop in shapes. Everything stays inside the printable area automatically."});
  s.push({el:"#tRect",t:(n++)+". Shapes pack",d:"Add a line, box, square, circle, triangle or heart. Boxes and triangles can have rounded corners. Each element you add is priced in as you go."});
  if(multi)s.push({el:"#partTabs",t:(n++)+". Choose what to print",d:"This product has more than one printable section. Tap a section to design it — you only pay for the sections you actually print."});
  s.push({el:"#inspector",t:(n++)+". Colours & Pantone",d:"Pick any colour for your text or shapes — we instantly show the closest Pantone shade, and it's printed on your final artwork so production matches exactly."});
  s.push({el:"#inspector",t:(n++)+". Finish & quantity",d:"Pick how it's printed, choose your quantity, and the final price updates instantly here — no hidden charges."});
  s.push({el:"#btnReview",t:(n++)+". Review & add to cart",d:"See your design on the real product and your final price, then add it to your cart. That's it!"});
  return s;
}
function startTour(){hideTip();tArr=tourSteps();tStep=0;$("tourScrim").classList.add("on");showStep();}
function showStep(){
  const st=tArr[tStep],el=document.querySelector(st.el);if(!el){return nextStep();}
  const r=el.getBoundingClientRect(),pad=6,hole=$("tourHole");
  hole.style.left=(r.left-pad)+"px";hole.style.top=(r.top-pad)+"px";hole.style.width=(r.width+pad*2)+"px";hole.style.height=(r.height+pad*2)+"px";
  const bub=$("tourBub");
  bub.innerHTML=`<h4>${st.t}</h4><p>${st.d}</p><div class="trow"><button class="skip" id="tSkip">Skip</button><div style="display:flex;align-items:center;gap:10px"><div class="dots">${tArr.map((_,i)=>`<span class="dt ${i===tStep?"on":""}"></span>`).join("")}</div>${tStep>0?'<button class="tb" id="tBack">Back</button>':""}<button class="tb primary" id="tNext">${tStep===tArr.length-1?"Got it":"Next →"}</button></div></div>`;
  bub.style.display="block";
  const bw=bub.offsetWidth||Math.min(300,innerWidth*0.86);
  let bl=r.right+14,bt=r.top;
  if(bl+bw>innerWidth-10){bl=Math.max(10,r.left);bt=r.bottom+14;}
  if(bt+bub.offsetHeight>innerHeight-10)bt=Math.max(10,innerHeight-bub.offsetHeight-10);
  bl=Math.min(Math.max(10,bl),innerWidth-bw-10);
  bub.style.left=bl+"px";bub.style.top=bt+"px";
  $("tNext").onclick=nextStep;$("tSkip").onclick=endTour;if($("tBack"))$("tBack").onclick=()=>{tStep--;showStep();};
}
function nextStep(){tStep++;if(tStep>=tArr.length)return endTour();showStep();}
function endTour(){$("tourScrim").classList.remove("on");$("tourBub").style.display="none";try{localStorage.setItem("ko_tour_done","1");}catch(e){}}
window.addEventListener("resize",()=>{if($("tourScrim").classList.contains("on"))showStep();});

if(window.fabric)boot();else window.addEventListener("load",boot);
</script>
